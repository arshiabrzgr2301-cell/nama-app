name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build nama-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          echo "Dependencies installed successfully"

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          # ImageMagick is available on ubuntu-latest runners — fast solid-color PNGs
          convert -size 1024x1024 xc:'#22d3ee' assets/icon.png
          convert -size 1284x2778 xc:'#0f172a' assets/splash.png
          convert -size 1024x1024 xc:'#22d3ee' assets/adaptive-icon.png
          convert -size 48x48 xc:'#22d3ee' assets/favicon.png
          ls -lh assets/
          echo "Placeholder assets created"

      - name: Prebuild Android project
        run: |
          npx expo prebuild --platform android --no-install
          echo "Expo prebuild completed"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          echo "Gradle build finished"

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No debug APK found after build"
            find android -name "*.apk" || true
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" nama-debug.apk
          ls -lh nama-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAMA-Android-APK
          path: nama-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo "NAMA Android Debug Build Summary"
          echo "========================================"
          if [ -f nama-debug.apk ]; then
            echo "SUCCESS: nama-debug.apk created"
            ls -lh nama-debug.apk
          else
            echo "FAILED: APK was not produced"
            echo "Check the logs above for Gradle or Expo errors."
          fi
