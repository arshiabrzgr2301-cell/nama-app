name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# جلوگیری از اجرای همزمان چند build روی main
concurrency:
  group: nama-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build nama-debug.apk
    # پین کردن نسخه برای جلوگیری از مهاجرت ناگهانی ubuntu-latest به Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # پایداری بیشتر Gradle در CI
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          echo "Dependencies installed successfully"

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          python3 << 'PY'
          import struct, zlib

          def create_png(path, w, h, r, g, b):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              row = bytes([0]) + bytes([r, g, b, 255]) * w
              raw = row * h
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              data = chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw, 1)) + chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n' + data)
              print(path, w, h, 'ok')

          create_png('assets/icon.png', 512, 512, 34, 211, 238)
          create_png('assets/splash.png', 512, 512, 15, 23, 42)
          create_png('assets/adaptive-icon.png', 512, 512, 34, 211, 238)
          create_png('assets/favicon.png', 48, 48, 34, 211, 238)
          print('Placeholder assets created')
          PY
          ls -lh assets/

      - name: Prebuild Android project
        run: |
          npx expo prebuild --platform android --no-install
          echo "Expo prebuild completed"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "Gradle build finished"

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No debug APK found after build"
            find android -name "*.apk" || true
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" nama-debug.apk
          ls -lh nama-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NAMA-Android-APK
          path: nama-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo "NAMA Android Debug Build Summary"
          echo "========================================"
          if [ -f nama-debug.apk ]; then
            echo "SUCCESS: nama-debug.apk created"
            ls -lh nama-debug.apk
          else
            echo "FAILED: APK was not produced"
            echo "Check the logs above for Gradle or Expo errors."
          fi
