name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build nama-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          echo "Dependencies installed successfully"

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          # Create minimal valid PNGs so Expo prebuild does not fail
          python3 -c "
          import struct, zlib
          def create_png(path, w, h, r, g, b):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              raw = b''
              for y in range(h):
                  raw += b'\x00'
                  for x in range(w):
                      raw += bytes([r, g, b, 255])
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              data = chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n' + data)
          create_png('assets/icon.png', 1024, 1024, 34, 211, 238)
          create_png('assets/splash.png', 1284, 2778, 15, 23, 42)
          create_png('assets/adaptive-icon.png', 1024, 1024, 34, 211, 238)
          create_png('assets/favicon.png', 48, 48, 34, 211, 238)
          print('Placeholder assets created')
          "

      - name: Prebuild Android project
        run: |
          npx expo prebuild --platform android --no-install
          echo "Expo prebuild completed"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          echo "Gradle build finished"

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No debug APK found after build"
            find android -name "*.apk" || true
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" nama-debug.apk
          ls -lh nama-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nama-debug.apk
          path: nama-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo "NAMA Android Debug Build Summary"
          echo "========================================"
          if [ -f nama-debug.apk ]; then
            echo "SUCCESS: nama-debug.apk created"
            ls -lh nama-debug.apk
          else
            echo "FAILED: APK was not produced"
            echo "Check the logs above for Gradle or Expo errors."
          fi
