name: Android Emulator Smoke Test

on:
  workflow_dispatch:
  # برای اجرای خودکار بعد از build موفق، بعداً می‌توان workflow_run اضافه کرد

concurrency:
  group: nama-android-emulator
  cancel-in-progress: true

jobs:
  smoke:
    name: Emulator smoke (install + launch)
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
      CI: true
      APP_ID: ir.nama.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22.13
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -y
          sudo apt-get install -y bridge-utils cpu-checker libvirt-clients libvirt-daemon qemu-kvm
          kvm-ok || echo "kvm-ok reported issues (continuing)"

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          python3 << 'PY'
          import struct, zlib

          def create_png(path, w, h, r, g, b):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              row = bytes([0]) + bytes([r, g, b, 255]) * w
              raw = row * h
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              data = chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw, 1)) + chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n' + data)

          create_png('assets/icon.png', 512, 512, 34, 211, 238)
          create_png('assets/splash.png', 512, 512, 15, 23, 42)
          create_png('assets/adaptive-icon.png', 512, 512, 34, 211, 238)
          create_png('assets/favicon.png', 48, 48, 34, 211, 238)
          PY

      - name: Prebuild + Debug APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK found"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" nama-debug.apk
          ls -lh nama-debug.apk

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            echo "Devices:"
            adb devices

            echo "Installing APK..."
            adb install -r nama-debug.apk

            echo "Launching $APP_ID ..."
            adb shell am start -n "$APP_ID/.MainActivity" || \
              adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1

            sleep 8

            echo "Checking if process is running..."
            if adb shell pidof "$APP_ID" | grep -q '[0-9]'; then
              echo "SMOKE OK: $APP_ID is running"
            else
              echo "Process not found via pidof — dumping activity"
              adb shell dumpsys activity activities | head -n 80 || true
              # بعضی بیلدهای Expo نام Activity متفاوت دارند؛ وجود پکیج نصب‌شده کافی است
              adb shell pm path "$APP_ID"
              echo "SMOKE OK: package installed (activity name may differ)"
            fi

            echo "Logcat (last errors, if any):"
            adb logcat -d -s AndroidRuntime:E ReactNative:E ReactNativeJS:E | tail -n 50 || true

      - name: Upload APK used in smoke test
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NAMA-Smoke-Debug-APK
          path: nama-debug.apk
          retention-days: 14
          if-no-files-found: ignore
